            - text: when you want Codex to assign more readable display names to spawned agents. This is especially helpful when you run many instances of the same custom agent and want the UI to show distinct labels instead of repeating the same agent name.
          - paragraph [ref=e455]:
            - text: Nicknames are presentation-only. Codex still identifies and spawns the agent by its
            - code [ref=e456]: name
            - text: .
          - paragraph [ref=e457]: Nickname candidates must be a non-empty list of unique names. Each nickname can use ASCII letters, digits, spaces, hyphens, and underscores.
