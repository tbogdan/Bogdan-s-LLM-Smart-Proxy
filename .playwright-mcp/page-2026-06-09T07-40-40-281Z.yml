                - cell "Spawned agent nesting depth (root session starts at 0)." [ref=e377]
              - row "agents.job_max_runtime_seconds number No Default timeout per worker for spawn_agents_on_csv jobs." [ref=e378]:
                - cell "agents.job_max_runtime_seconds" [ref=e379]:
                  - code [ref=e380]: agents.job_max_runtime_seconds
                - cell "number" [ref=e381]
                - cell "No" [ref=e382]
                - cell "Default timeout per worker for spawn_agents_on_csv jobs." [ref=e383]:
                  - text: Default timeout per worker for
                  - code [ref=e384]: spawn_agents_on_csv
                  - text: jobs.
          - paragraph [ref=e385]:
            - strong [ref=e386]: "Notes:"
          - list [ref=e387]:
            - listitem [ref=e388]:
              - code [ref=e389]: agents.max_threads
              - text: defaults to
              - code [ref=e390]: "6"
              - text: when you leave it unset.
            - listitem [ref=e391]:
              - code [ref=e392]: agents.max_depth
              - text: defaults to
              - code [ref=e393]: "1"
              - text: ", which allows a direct child agent to spawn but prevents deeper nesting. Keep the default unless you specifically need recursive delegation. Raising this value can turn broad delegation instructions into repeated fan-out, which increases token usage, latency, and local resource consumption."
              - code [ref=e394]: agents.max_threads
              - text: still caps concurrent open threads, but it doesn’t remove the cost and predictability risks of deeper recursion.
            - listitem [ref=e395]:
              - code [ref=e396]: agents.job_max_runtime_seconds
              - text: is optional. When you leave it unset,
              - code [ref=e397]: spawn_agents_on_csv
              - text: falls back to its per-call default timeout of 1800 seconds per worker.
            - listitem [ref=e398]:
              - text: If a custom agent name matches a built-in agent such as
              - code [ref=e399]: explorer
              - text: ", your custom agent takes precedence."
