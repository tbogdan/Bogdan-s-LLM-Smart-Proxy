    - main [ref=e236]:
      - generic [ref=e239]:
        - generic [ref=e241]:
          - heading "Subagents" [level=1] [ref=e242]
          - paragraph [ref=e243]: Use subagents and custom agents in Codex
          - button "Copy Page" [ref=e246] [cursor=pointer]:
            - img [ref=e248]
            - generic [ref=e250]: Copy Page
        - article [ref=e251]:
          - paragraph [ref=e252]: Codex can run subagent workflows by spawning specialized agents in parallel and then collecting their results in one response. This can be particularly helpful for complex tasks that are highly parallel, such as codebase exploration or implementing a multi-step feature plan.
          - paragraph [ref=e253]: With subagent workflows, you can also define your own custom agents with different model configurations and instructions depending on the task.
          - paragraph [ref=e254]:
            - text: For the concepts and tradeoffs behind subagent workflows, including context pollution, context rot, and model-selection guidance, see
            - link "Subagent concepts" [ref=e255] [cursor=pointer]:
              - /url: /codex/concepts/subagents
            - text: .
          - heading "Availability Copy link to availability" [level=2] [ref=e256]:
            - generic [ref=e257]: Availability
            - button "Copy link to availability" [ref=e258] [cursor=pointer]:
              - img [ref=e259]
          - paragraph [ref=e261]: Current Codex releases enable subagent workflows by default.
          - generic [ref=e263]:
            - img [ref=e265]
            - paragraph [ref=e270]: Subagent activity is currently surfaced in the Codex app and CLI. Visibility in the IDE Extension is coming soon.
          - paragraph [ref=e271]: Codex only spawns subagents when you explicitly ask it to. Because each subagent does its own model and tool work, subagent workflows consume more tokens than comparable single-agent runs.
          - heading "Typical workflow Copy link to typical workflow" [level=2] [ref=e272]:
            - generic [ref=e273]: Typical workflow
            - button "Copy link to typical workflow" [ref=e274] [cursor=pointer]:
              - img [ref=e275]
          - paragraph [ref=e277]: Codex handles orchestration across agents, including spawning new subagents, routing follow-up instructions, waiting for results, and closing agent threads.
          - paragraph [ref=e278]: When many agents are running, Codex waits until all requested results are available, then returns a consolidated response.
          - paragraph [ref=e279]: Codex only spawns a new agent when you explicitly ask it to do so.
          - paragraph [ref=e280]: "To see it in action, try the following prompt on your project:"
          - generic [ref=e281]:
            - code [ref=e282]:
              - generic [ref=e283]: I would like to review the following points on the current PR (this branch vs main). Spawn one agent per point, wait for all of them, and summarize the result for each point.
              - generic [ref=e284]: 1. Security issue
              - generic [ref=e285]: 2. Code quality
              - generic [ref=e286]: 3. Bugs
              - generic [ref=e287]: 4. Race
              - generic [ref=e288]: 5. Test flakiness
              - generic [ref=e289]: 6. Maintainability of the code
            - button "Copy code to clipboard" [ref=e291] [cursor=pointer]:
              - img [ref=e292]
          - heading "Managing subagents Copy link to managing subagents" [level=2] [ref=e294]:
            - generic [ref=e295]: Managing subagents
            - button "Copy link to managing subagents" [ref=e296] [cursor=pointer]:
              - img [ref=e297]
          - list [ref=e299]:
            - listitem [ref=e300]:
              - text: Use
              - code [ref=e301]: /agent
              - text: in the CLI to switch between active agent threads and inspect the ongoing thread.
            - listitem [ref=e302]: Ask Codex directly to steer a running subagent, stop it, or close completed agent threads.
          - heading "Approvals and sandbox controls Copy link to approvals and sandbox controls" [level=2] [ref=e303]:
            - generic [ref=e304]: Approvals and sandbox controls
            - button "Copy link to approvals and sandbox controls" [ref=e305] [cursor=pointer]:
              - img [ref=e306]
          - paragraph [ref=e308]: Subagents inherit your current sandbox policy.
          - paragraph [ref=e309]:
            - text: In interactive CLI sessions, approval requests can surface from inactive agent threads even while you are looking at the main thread. The approval overlay shows the source thread label, and you can press
            - code [ref=e310]: o
            - text: to open that thread before you approve, reject, or answer the request.
          - paragraph [ref=e311]: In non-interactive flows, or whenever a run can’t surface a fresh approval, an action that needs new approval fails and Codex surfaces the error back to the parent workflow.
          - paragraph [ref=e312]:
            - text: Codex also reapplies the parent turn’s live runtime overrides when it spawns a child. That includes sandbox and approval choices you set interactively during the session, such as
            - code [ref=e313]: /permissions
            - text: changes or
            - code [ref=e314]: "--yolo"
            - text: ", even if the selected custom agent file sets different defaults."
          - paragraph [ref=e315]:
            - text: You can also override the sandbox configuration for individual
            - link "custom agents" [ref=e316] [cursor=pointer]:
              - /url: "#custom-agents"
            - text: ", such as explicitly marking one to work in read-only mode."
          - heading "Custom agents Copy link to custom agents" [level=2] [ref=e317]:
            - generic [ref=e318]: Custom agents
            - button "Copy link to custom agents" [ref=e319] [cursor=pointer]:
              - img [ref=e320]
          - paragraph [ref=e322]: "Codex ships with built-in agents:"
          - list [ref=e323]:
            - listitem [ref=e324]:
              - code [ref=e325]: default
              - text: ": general-purpose fallback agent."
            - listitem [ref=e326]:
              - code [ref=e327]: worker
              - text: ": execution-focused agent for implementation and fixes."
            - listitem [ref=e328]:
              - code [ref=e329]: explorer
              - text: ": read-heavy codebase exploration agent."
          - paragraph [ref=e330]:
            - text: To define your own custom agents, add standalone TOML files under
            - code [ref=e331]: ~/.codex/agents/
            - text: for personal agents or
            - code [ref=e332]: .codex/agents/
            - text: for project-scoped agents.
          - paragraph [ref=e333]: Each file defines one custom agent. Codex loads these files as configuration layers for spawned sessions, so custom agents can override the same settings as a normal Codex session config. That can feel heavier than a dedicated agent manifest, and the format may evolve as authoring and sharing mature.
          - paragraph [ref=e334]: "Every standalone custom agent file must define:"
          - list [ref=e335]:
            - listitem [ref=e336]:
              - code [ref=e337]: name
            - listitem [ref=e338]:
              - code [ref=e339]: description
            - listitem [ref=e340]:
              - code [ref=e341]: developer_instructions
          - paragraph [ref=e342]:
            - text: Optional fields such as
            - code [ref=e343]: nickname_candidates
            - text: ","
            - code [ref=e344]: model
            - text: ","
            - code [ref=e345]: model_reasoning_effort
            - text: ","
            - code [ref=e346]: sandbox_mode
            - text: ","
            - code [ref=e347]: mcp_servers
            - text: ", and"
            - code [ref=e348]: skills.config
            - text: inherit from the parent session when you omit them.
          - heading "Global settings Copy link to global settings" [level=3] [ref=e349]:
            - generic [ref=e350]: Global settings
            - button "Copy link to global settings" [ref=e351] [cursor=pointer]:
              - img [ref=e352]
          - paragraph [ref=e354]:
            - text: Global subagent settings still live under
            - code [ref=e355]: "[agents]"
            - text: in your
            - link "configuration" [ref=e356] [cursor=pointer]:
              - /url: /codex/config-basic#configuration-precedence
