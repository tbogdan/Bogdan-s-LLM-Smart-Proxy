services:
  llm-proxy:
    build: .
    ports:
      - "${LLM_PROXY_PORT:-18900}:18900"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROXY_PORT: "18900"
      MEMPALACE_ENABLED: ${MEMPALACE_ENABLED:-false}
      MEMPALACE_URL: http://mempalace-mcp:8891
    volumes:
      - ./data:/data
    restart: unless-stopped

  llm-discovery:
    build: .
    command: ["node", "llm-discovery.js"]
    env_file:
      - path: .env
        required: false
    environment:
      MEMPALACE_ENABLED: ${MEMPALACE_ENABLED:-false}
      MEMPALACE_URL: http://mempalace-mcp:8891
    volumes:
      - ./data:/data
    restart: unless-stopped

  codex-proxy:
    build:
      context: .
      dockerfile: Dockerfile.codex
    volumes:
      - ./data/codex-auth.json:/root/.codex/auth.json
    ports:
      - "10531:10531"
    restart: unless-stopped
    profiles: [codex]

  mempalace-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mempalace
    volumes:
      - ./palace:/palace
      - ./data:/data
    ports:
      - "8891:8891"
    restart: unless-stopped
    profiles: [memory]
