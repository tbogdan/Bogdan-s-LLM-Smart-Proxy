services:
  llm-proxy:
    build: .
    ports:
      - "${LLM_PROXY_PORT:-18900}:18900"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROXY_PORT: "18900"
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_BACKEND: ${MEMORY_BACKEND:-local}
      MEMORY_MAX_INJECT_TOKENS: ${MEMORY_MAX_INJECT_TOKENS:-2000}
      GRAPHITI_NEO4J_URI: bolt://graphiti-neo4j:7687
      GRAPHITI_NEO4J_USER: ${GRAPHITI_NEO4J_USER:-neo4j}
      GRAPHITI_NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:-graphiti-memory-local}
    volumes:
      - ./data:/data
    restart: unless-stopped

  llm-discovery:
    build: .
    command: ["node", "llm-discovery.js"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    restart: unless-stopped

  codex-proxy:
    build:
      context: .
      dockerfile: Dockerfile.codex
    volumes:
      - ./data/codex-auth.json:/root/.codex/auth.json
    ports:
      - "${CODEX_PROXY_PORT:-10531}:10531"
    restart: unless-stopped
    profiles: [codex]

  graphiti-neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${GRAPHITI_NEO4J_USER:-neo4j}/${GRAPHITI_NEO4J_PASSWORD:-graphiti-memory-local}"
    volumes:
      - ./data/neo4j:/data
    ports:
      - "${GRAPHITI_NEO4J_PORT:-7687}:7687"
      - "${GRAPHITI_NEO4J_HTTP_PORT:-7474}:7474"
    restart: unless-stopped
    profiles: [memory]
