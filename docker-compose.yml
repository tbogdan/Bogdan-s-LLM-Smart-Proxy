services:
  llm-proxy:
    entrypoint: ["/bin/sh", "/opt/proxy-resource-entrypoint.sh"]
    command: ["node", "llm-proxy.js"]
    mem_limit: "${LLM_PROXY_MEMORY_LIMIT:-2g}"
    cpus: "${LLM_PROXY_CPU_LIMIT:-2.0}"
    pids_limit: ${LLM_PROXY_PIDS_LIMIT:-256}
    build: .
    ports:
      - "127.0.0.1:${LLM_PROXY_PORT:-18900}:18900"
    env_file:
      - path: .env
        required: false
    environment:
      PROXY_RESOURCE_MEMORY: "${LLM_PROXY_MEMORY_LIMIT:-2g}"
      PROXY_RESOURCE_CPUS: "${LLM_PROXY_CPU_LIMIT:-2.0}"
      PROXY_RESOURCE_PIDS: "${LLM_PROXY_PIDS_LIMIT:-256}"
      LLM_PROXY_PORT: "18900"
      MEMORY_ENABLED: "${MEMORY_ENABLED:-false}"
      MEMORY_BACKEND: "${MEMORY_BACKEND:-local}"
      MEMORY_MAX_INJECT_TOKENS: "2000"
      MEMORY_ARCHIVE_MAX_CHARS: "30000"
      GRAPHITI_NEO4J_URI: bolt://graphiti-neo4j:7687
      GRAPHITI_NEO4J_USER: neo4j
      GRAPHITI_NEO4J_PASSWORD: graphiti-memory-local
      GRAPHITI_NEO4J_DATABASE: neo4j
      GRAPHITI_MCP_ENABLED: "${GRAPHITI_MCP_ENABLED:-false}"
      GRAPHITI_MCP_URL: http://graphiti-mcp:8000/mcp/
      GRAPHITI_MCP_GROUP_ID: llm-proxy
      GRAPHITI_MCP_TIMEOUT_MS: "1200"
      GRAPHITI_MCP_WRITE_TIMEOUT_MS: "5000"
      GRAPHITI_MCP_SEARCH_TIMEOUT_MS: "1200"
      GRAPHITI_MCP_OUTBOX_BATCH: "1"
      GRAPHITI_MCP_OUTBOX_MAX_DRAIN_BATCHES: "1"
      GRAPHITI_MCP_OUTBOX_DRAIN_RESCHEDULE_MS: "60000"
      LLM_PROXY_EMBEDDING_MODEL: llm-proxy-hash-embedding-1536
      LLM_PROXY_EMBEDDING_DIMENSIONS: "1536"
      LLM_PROXY_AI_SUMMARY_MODEL: auto-text
      LLM_PROXY_AI_SUMMARY_TIMEOUT_MS: "12000"
      LLM_PROXY_AI_SUMMARY_MAX_TOKENS: "500"
      LLM_PROXY_AI_SUMMARY_MIN_MESSAGES: "1"
      CODEX_API_KEY: proxy
    volumes:
      - ./scripts/resource-guard.js:/opt/proxy-resource-guard.js:ro
      - ./scripts/resource-entrypoint.sh:/opt/proxy-resource-entrypoint.sh:ro
      - ./data:/data
    restart: unless-stopped

  llm-discovery:
    profiles: [discovery]
    build: .
    command: ["node", "llm-discovery.js"]
    env_file:
      - path: .env
        required: false
    environment:
      CODEX_API_KEY: proxy
    volumes:
      - ./data:/data
    restart: unless-stopped

  codex-proxy:
    entrypoint: ["/bin/sh", "/opt/proxy-resource-entrypoint.sh"]
    command: ["openai-oauth", "--host", "0.0.0.0", "--port", "10531"]
    environment:
      PROXY_RESOURCE_MEMORY: "${CODEX_PROXY_MEMORY_LIMIT:-1g}"
      PROXY_RESOURCE_CPUS: "${CODEX_PROXY_CPU_LIMIT:-1.0}"
      PROXY_RESOURCE_PIDS: "${CODEX_PROXY_PIDS_LIMIT:-256}"
    mem_limit: "${CODEX_PROXY_MEMORY_LIMIT:-1g}"
    cpus: "${CODEX_PROXY_CPU_LIMIT:-1.0}"
    pids_limit: ${CODEX_PROXY_PIDS_LIMIT:-256}
    build:
      context: .
      dockerfile: Dockerfile.codex
    volumes:
      - ./scripts/resource-guard.js:/opt/proxy-resource-guard.js:ro
      - ./scripts/resource-entrypoint.sh:/opt/proxy-resource-entrypoint.sh:ro
      - ./data/codex-auth.json:/root/.codex/auth.json
    ports:
      - "127.0.0.1:${CODEX_PROXY_PORT:-10531}:10531"
    restart: unless-stopped
    profiles: [codex]

  graphiti-neo4j:
    profiles: [memory]
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: "neo4j/graphiti-memory-local"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/neo4j/bin/cypher-shell -u neo4j -p graphiti-memory-local 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  graphiti-mcp:
    profiles: [memory]
    build:
      context: .
      dockerfile: Dockerfile.graphiti-mcp
    image: llm-proxy-graphiti-mcp:local
    depends_on:
      graphiti-neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://graphiti-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphiti-memory-local
      NEO4J_DATABASE: neo4j
      GRAPHITI_GROUP_ID: llm-proxy
      MODEL_NAME: auto-memory
      OPENAI_API_KEY: llm-proxy
      OPENAI_API_URL: http://llm-proxy:18900/v1
      OPENAI_BASE_URL: http://llm-proxy:18900/v1
      GRAPHITI_MCP_EMBEDDING_MODEL: llm-proxy-hash-embedding-1536
      GRAPHITI_MCP_EMBEDDING_DIMENSIONS: "1536"
      SEMAPHORE_LIMIT: "1"
      GRAPHITI_TELEMETRY_ENABLED: "false"
      CONFIG_PATH: /app/mcp/config/config.yaml
      PATH: "/root/.local/bin:${PATH}"
    volumes:
      - ./config/graphiti-mcp-neo4j.yaml:/app/mcp/config/config.yaml:ro
    restart: unless-stopped
