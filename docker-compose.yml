name: llm-proxy-docker

services:
  llm-proxy:
    build: .
    ports:
      - "18920:18900"
    env_file: .env
    environment:
      LLM_PROXY_PORT: "18900"
    volumes:
      - ./data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/graphiti-memory-local
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  graphiti-mcp:
    image: zepai/graphiti-mcp:latest
    ports:
      - "8001:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphiti-memory-local
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: llm-proxy
      OPENAI_API_URL: http://llm-proxy:18900/v1
      GRAPHITI_GROUP_ID: llm-proxy
    volumes:
      - ./config/graphiti-mcp-neo4j.yaml:/app/config.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  codex-proxy:
    build:
      context: .
      dockerfile: Dockerfile.codex
    volumes:
      - ./data/codex-auth.json:/root/.codex/auth.json:ro
    ports:
      - "10532:10531"
    restart: unless-stopped
    profiles: [codex]

volumes:
  neo4j-data:
  neo4j-logs:
